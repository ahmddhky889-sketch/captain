<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1B7FAE">
<script>try{var __t=localStorage.getItem("captain_theme");if(__t==="light"||__t==="dark"){document.documentElement.setAttribute("data-theme",__t);var __m=document.querySelector('meta[name="theme-color"]');if(__m)__m.setAttribute("content",__t==="dark"?"#0B1B23":"#1B7FAE");}}catch(e){}</script>
<title>القبطان</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="القبطان">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* القبطان: ألوان البحر والذهب، حواف ٢٠، نقشة نجمة البوصلة، فاتح وداكن حسب النظام */
:root{
  --bg-outer:#E9F1F4; --bg:#F4F9FB; --surface:#FFFFFF; --surface-2:#EAF4F8; --line:#C9DDE5;
  --fg:#10303D; --fg-2:#4B6874;
  --primary:#1B7FAE; --on-primary:#FFFFFF; --primary-soft:#D8EEF6;
  --band-1:#CFEAF5; --band-2:#E3F3F9;
  --gold:#C9962B; --gold-soft:#F7EBCB; --gold-ink:#6B4A06;
  --danger:#A63B2E; --danger-soft:#F6DDD8;
  --pat:rgba(27,127,174,.24); --shadow:0 6px 20px rgba(16,48,61,.08); --scrim:rgba(8,24,31,.5);
  --font:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-outer:#06141A; --bg:#0B1B23; --surface:#122732; --surface-2:#173341; --line:#27414E;
    --fg:#E6F3F8; --fg-2:#9DB8C4;
    --primary:#58BFE3; --on-primary:#06222D; --primary-soft:#173B4A;
    --band-1:#123241; --band-2:#0E2630;
    --gold:#E0B04A; --gold-soft:#3A2F14; --gold-ink:#F0CF85;
    --danger:#F0A090; --danger-soft:#3D1F1A;
    --pat:rgba(88,191,227,.22); --shadow:0 6px 20px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg-outer:#06141A; --bg:#0B1B23; --surface:#122732; --surface-2:#173341; --line:#27414E;
    --fg:#E6F3F8; --fg-2:#9DB8C4;
    --primary:#58BFE3; --on-primary:#06222D; --primary-soft:#173B4A;
    --band-1:#123241; --band-2:#0E2630;
    --gold:#E0B04A; --gold-soft:#3A2F14; --gold-ink:#F0CF85;
    --danger:#F0A090; --danger-soft:#3D1F1A;
    --pat:rgba(88,191,227,.22); --shadow:0 6px 20px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
.brandbox{display:flex;align-items:center;gap:10px}
.themebtn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1.5px solid var(--gold);color:var(--gold);flex:none}
.themebtn .ic{width:22px;height:22px;color:var(--gold)}
.hdr .themebtn{position:relative;margin-inline-start:auto;margin-inline-end:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-outer);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.6;direction:rtl;text-align:right;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pl{stroke:var(--pat);fill:none;stroke-width:1}
.pat{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pat~*{position:relative}

.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;min-height:100dvh;position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.app.notabs{padding-bottom:32px}

/* هيدر الرئيسية */
.band{position:relative;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:14px;background:linear-gradient(var(--band-1),var(--band-2));border-radius:0 0 var(--r) var(--r);z-index:5}
.band .pat{-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.search{position:relative;display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
.search:focus-within{border-color:var(--primary)}
.search .ic{color:var(--primary)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;font-size:15px;text-align:right}
.search input::placeholder{color:var(--fg-2)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.search .clr{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--fg-2)}
.search .clr .ic{width:18px;height:18px;color:inherit}
.locked .search{opacity:.55;pointer-events:none}
.meta-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.loc{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.loc .ic{width:20px;height:20px;color:var(--primary)}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--gold-ink);white-space:nowrap}
.brand .ic{width:18px;height:18px;color:var(--gold)}

/* الاقتراحات */
.sugg{position:absolute;top:calc(16px + env(safe-area-inset-top,0px) + 54px + 8px);right:max(16px,env(safe-area-inset-right,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px;max-height:60vh;overflow-y:auto;z-index:30}
.sugg h4{margin:8px 10px 4px;font-size:12px;font-weight:700;color:var(--fg-2)}
.sg{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;text-align:right}
.sg:hover,.sg:focus-visible{background:var(--surface-2)}
.sg .t{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary);flex:none}
.sg .t .ic{width:22px;height:22px}
.sg .n{display:block;font-weight:700;font-size:14px;line-height:1.3}
.sg .s{font-size:12px;color:var(--fg-2)}
.sg-empty{padding:12px 10px;color:var(--fg-2);font-size:13px}

/* شريط خفيف ورسائل */
.note{padding-top:14px}
.ridecard{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:14px 16px;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:var(--r);color:var(--fg);text-align:right}
.ridecard .ic{width:36px;height:36px;flex:none;color:var(--gold-ink)}
.ridecard b{display:block;font-size:16px;line-height:1.4}
.ridecard span{font-size:13px;color:var(--fg-2);line-height:1.6}
.note p{margin:0;padding:8px 14px;border-radius:var(--r);background:var(--gold-soft);color:var(--gold-ink);font-size:13px;font-weight:600;text-align:center}

/* أنواع المحلات */
.cats{display:flex;gap:10px;overflow-x:auto;padding-top:16px;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;width:78px;flex:none;scroll-snap-align:start}
.cat .box{position:relative;display:grid;place-items:center;width:60px;height:60px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);color:var(--primary)}
.cat .lbl{font-size:12px;line-height:1.35;text-align:center;font-weight:600;min-height:2.7em}
.cat[aria-pressed="true"] .box{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.cat[aria-pressed="true"] .box::after{content:"";position:absolute;bottom:-7px;width:18px;height:4px;border-radius:4px;background:var(--gold)}
.cat[aria-pressed="true"] .lbl{color:var(--primary);font-weight:800}

/* عناوين الأقسام */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:10px}
.sec-head h2{margin:0;font-size:20px;line-height:1.3;font-weight:800}
.sec-head span{font-size:12px;color:var(--fg-2)}
.list{display:flex;flex-direction:column;gap:12px}
.card{position:relative;display:flex;align-items:stretch;gap:14px;width:100%;padding:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);text-align:right;transition:border-color .15s}
.card:hover{border-color:var(--primary)}
.card.flash{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.thumb{position:relative;display:grid;place-items:center;width:76px;min-height:76px;border-radius:14px;background:var(--primary-soft);color:var(--primary);overflow:hidden;flex:none}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ic{position:relative;width:32px;height:32px}
.thumb.sq{width:80px;height:80px;min-height:80px}
.body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;justify-content:center}
.body .nm{font-size:16px;font-weight:700;line-height:1.3}
.body .sc{font-size:12px;color:var(--fg-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--fg)}
.chip .ic{width:14px;height:14px}
.chip.t{background:var(--gold-soft);color:var(--gold-ink)}

/* حالات */
.deny{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px;padding:28px 20px;text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.deny .pat{opacity:.5}
.deny .big{display:grid;place-items:center;width:64px;height:64px;border-radius:var(--r);background:var(--gold-soft);color:var(--gold-ink)}
.deny .big .ic{width:32px;height:32px}
.deny h2{margin:0;font-size:22px;font-weight:800}
.deny p{margin:0;color:var(--fg-2);max-width:34ch}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--primary);animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:24px 16px;text-align:center;color:var(--fg-2);line-height:1.8}

/* أزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r);font-weight:700;font-size:15px;border:1.5px solid var(--primary)}
.btn .ic{width:20px;height:20px}
.btn.p{background:var(--primary);color:var(--on-primary)}
.btn.s{background:transparent;color:var(--primary)}
.btn.d{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.6;cursor:default}

/* الجملة التشجيعية */
.cheer{padding-top:22px}
.cheer .in{position:relative;padding:26px 20px;border-radius:var(--r);background:var(--gold-soft);border:1.5px solid var(--gold);text-align:center;overflow:hidden}
.cheer .pat{opacity:.5}
.cheer h3{margin:0;font-size:22px;line-height:1.9;font-weight:800;color:var(--gold-ink)}
.cheer p{margin:6px 0 0;color:var(--gold-ink);opacity:.9;font-size:13px}

/* هيدر الشاشات الداخلية */
.hdr{position:relative;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 16px;background:linear-gradient(var(--band-1),var(--band-2));border-radius:0 0 var(--r) var(--r);overflow:hidden}
.hdr .pat{-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.hdr-top{position:relative;display:flex;align-items:center;gap:4px}
.back{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;flex:none}
.hdr h1{margin:0;font-size:22px;font-weight:800;line-height:1.3;min-width:0}
.hdr .sub{position:relative;padding:0 12px;font-size:13px;color:var(--fg-2)}
.hdr .chips{position:relative;padding:10px 12px 0}
.adm{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}
.adm .btn{min-height:40px;padding:0 14px;font-size:13px}

/* شبكة الأقسام */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:112px;padding:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);text-align:right}
.tile:hover{border-color:var(--primary)}
.tile .i{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--primary-soft);color:var(--primary)}
.tile .n{font-size:15px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.tile .c{font-size:12px;color:var(--fg-2)}

/* شاشة المنتج */
.pimg{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:var(--r);border:1.5px solid var(--line);overflow:hidden;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pimg .ic{position:relative;width:48px;height:48px}
.ptitle{margin:16px 0 0;font-size:22px;font-weight:800;line-height:1.4}
.flbl{margin:14px 0 4px;font-size:13px;font-weight:700;color:var(--fg-2)}
.feat{margin:0;font-size:15px;line-height:1.9}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.info{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);text-align:center;min-width:0}
.info .ic{width:22px;height:22px;color:var(--primary)}
.info .l{font-size:11px;color:var(--fg-2)}
.info .v{font-size:13px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.info .v.ltr{direction:ltr;unicode-bidi:isolate}
.react{margin-top:24px;padding:18px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);text-align:center}
.react h3{margin:0 0 14px;font-size:16px;font-weight:700}
.react .row{display:flex;justify-content:space-evenly;gap:8px}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;border-radius:var(--r);font-size:12px;font-weight:600}
.face .b{display:grid;place-items:center;width:64px;height:64px;border-radius:var(--r);background:var(--surface-2);border:1.5px solid var(--line);color:var(--fg-2)}
.face .b .ic{width:34px;height:34px}
.face.yes .b{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}

/* السلة */
.basket{flex-direction:column;gap:0;padding:6px 14px}
.ci{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.ci:last-of-type{border-bottom:0}
.ci .cn{min-width:0}.ci .cn b{display:block;font-size:15px;line-height:1.4}.ci .cn span{font-size:12px;color:var(--fg-2)}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--primary)}
.qty button .ic{width:18px;height:18px}
.qty output{min-width:28px;text-align:center;font-weight:800}
.sum{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-weight:800;border-top:1.5px solid var(--line)}
.sum.sm{font-weight:600;font-size:13px;color:var(--fg-2);border:0;padding:4px 0 10px}
.bdg{position:absolute;top:-2px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-style:normal;font-weight:800;line-height:18px;text-align:center}
.tab .ico{position:relative;display:grid;place-items:center}
.gold-btn{margin-top:12px}
/* التبويبات */
.tabs{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;display:flex;gap:4px;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1.5px solid var(--line);border-radius:var(--r) var(--r) 0 0;z-index:20}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:6px 2px;border-radius:14px;color:var(--fg-2);font-size:11px;font-weight:600;line-height:1.25;text-align:center}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--primary);background:var(--primary-soft);font-weight:800}

/* النماذج السفلية */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.scrim.mid{align-items:center;padding:20px}
.sheet{position:relative;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow-y:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.scrim.mid .sheet{border-radius:var(--r);padding-bottom:20px;max-width:360px;text-align:center}
.sheet h2{margin:12px 0 4px;font-size:20px;font-weight:800}
.sheet p{margin:0 0 4px;color:var(--fg-2);line-height:1.7}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:700;color:var(--fg-2)}
.field input,.field select,.field textarea{width:100%;padding:13px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);font-size:15px;text-align:right}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);outline:0}
.field input.ltr{direction:ltr;text-align:left}
.field textarea{min-height:96px;resize:vertical;line-height:1.7}
.field .hint{font-size:12px;color:var(--fg-2)}
.imgbox{aspect-ratio:4/3;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);overflow:hidden;display:grid;place-items:center}
.imgbox img{width:100%;height:100%;object-fit:cover}
.imgbox .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--fg-2)}
.imgbox .ph .ic{width:36px;height:36px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.acc{margin-top:20px;padding:20px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:12px}
.acc h2{margin:0;font-size:20px}
.acc p{margin:0;color:var(--fg-2);line-height:1.8}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(440px,calc(100% - 32px));padding:10px 18px;background:var(--fg);color:var(--bg);border-radius:var(--r);font-weight:600;font-size:13px;text-align:center;z-index:80}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="capPat" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect class="pl" x="10" y="10" width="28" height="28"/>
      <rect class="pl" x="10" y="10" width="28" height="28" transform="rotate(45 24 24)"/>
      <circle class="pl" cx="24" cy="24" r="4"/>
      <circle class="pl" cx="0" cy="0" r="3"/><circle class="pl" cx="48" cy="0" r="3"/>

<script>
(function(){
'use strict';

/* ===== الإعدادات ===== */
var BASE='https://rbukxectfdssjpkaijcl.supabase.co';
var KEY='sb_publishable_geGMlQRoeu67nBFM2qeNEw_BYB4ViJr'; /* مفتاح عام مصمم للتطبيقات، والحماية الفعلية داخل قاعدة البيانات */
var BUCKET='product-images';
var NOT_ALLOWED='عذرا لايمكن الإضافة';
var SOON='سنجهّز هذه الشاشة معك في الخطوة التالية';

/* ===== أدوات عامة ===== */
var AR='٠١٢٣٤٥٦٧٨٩';
function arNum(v){return String(v).replace(/\d/g,function(d){return AR[+d]}).replace(/\./g,'٫');}
function westernDigits(s){return String(s).replace(/[٠-٩]/g,function(d){return AR.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/٫/g,'.').replace(/،/g,',');}
function num(v){var n=parseFloat(westernDigits(String(v).trim()));return isNaN(n)?null:n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function nl2br(s){return esc(s).replace(/\n/g,'<br>');}
function telOf(n){var t=westernDigits(n).replace(/[^0-9+]/g,'');return t;}
function arKm(km){return arNum(km.toFixed(1))+' كم';}
function arPrice(p){var n=Number(p);return arNum(n===Math.round(n)?n:n.toFixed(2))+' ج.م';}
function arCount(n){return n===1?'مكان واحد':n===2?'مكانان':arNum(n)+' أماكن';}
function arProducts(n){return n===0?'لا منتجات بعد':n===1?'منتج واحد':n===2?'منتجان':n<=10?arNum(n)+' منتجات':arNum(n)+' منتجًا';}
function icon(n,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
function patSvg(){return '<svg class="pat" aria-hidden="true"><rect width="100%" height="100%" fill="url(#capPat)"/></svg>';}
function haversine(a,b,c,d){var R=6371,t=Math.PI/180,dl=(c-a)*t,dn=(d-b)*t;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));}
/* وقت التوصيل: زمن التجهيز + ٣ دقائق لكل كيلومتر، بهامش خمس دقائق */
function etaText(prep,km){var lo=prep+Math.round(km*3);return 'من '+arNum(lo)+' إلى '+arNum(lo+5)+' دقيقة';}
function $(id){return document.getElementById(id);}
function imgUrl(path){return path?BASE+'/storage/v1/object/public/'+BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/'):null;}

var toastT;
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3000);}
/* الوضع الفاتح والداكن: افتراضيًا يتبع النظام، وبعد الضغط على المقود يُحفظ اختيارك */
function curTheme(){var t=document.documentElement.getAttribute('data-theme');if(t==='dark'||t==='light')return t;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B1B23':'#1B7FAE');}
function toggleTheme(){var t=curTheme()==='dark'?'light':'dark';applyTheme(t);try{localStorage.setItem('captain_theme',t);}catch(e){}toast(t==='dark'?'تم تفعيل الوضع الداكن':'تم تفعيل الوضع الفاتح');}

/* ===== الاتصال بقاعدة البيانات (REST مباشر) ===== */
var SKEY='captain_session';
var session=null;
try{var raw=JSON.parse(localStorage.getItem(SKEY)||'null');if(raw&&raw.access_token)session=raw;}catch(e){}
function sessFrom(j){var now=Math.floor(Date.now()/1000);return{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||(now+(j.expires_in||3600)),user:j.user||(session&&session.user)||null};}
function me(){var u=session&&session.user,m=(u&&u.user_metadata)||{};return{email:(u&&u.email)||'',name:m.name||'',phone:m.phone||''};}
function saveSession(s){session=s;try{if(s)localStorage.setItem(SKEY,JSON.stringify(s));else localStorage.removeItem(SKEY);}catch(e){}}
function authHeaders(extra){var h={'apikey':KEY};if(session)h['Authorization']='Bearer '+session.access_token;if(extra)for(var k in extra)h[k]=extra[k];return h;}
/* تجديد الجلسة: لا نمسحها إلا إذا رفضها السيرفر نفسه فعلًا، وأي انقطاع نت أو خطأ مؤقت لا يُخرج المستخدم */
var refreshing=null;
function nowSec(){return Math.floor(Date.now()/1000);}
function readStored(){try{var r=JSON.parse(localStorage.getItem(SKEY)||'null');return r&&r.access_token?r:null;}catch(e){return null;}}
async function doRefresh(){
  var st=readStored();
  if(st&&session&&st.refresh_token!==session.refresh_token){session=st;if(!st.expires_at||st.expires_at-nowSec()>120)return;}
  var rt=session&&session.refresh_token;if(!rt)return;
  try{
    var r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
    if(r.ok){saveSession(sessFrom(await r.json()));return;}
    var st2=readStored();
    if(st2&&st2.refresh_token!==rt){session=st2;return;}
    if(r.status===400||r.status===401||r.status===403){saveSession(null);S.isAdmin=false;}
  }catch(e){}
}
async function refreshIfNeeded(){
  if(!session)return;
  if(session.expires_at&&session.expires_at-nowSec()>120)return;
  if(!refreshing)refreshing=doRefresh().then(function(){refreshing=null;},function(){refreshing=null;});
  await refreshing;
}
async function api(method,path,opts){
  opts=opts||{};
  await refreshIfNeeded();
  var h=authHeaders(opts.headers),body;
  if(opts.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(opts.json);}
  var res=await fetch(BASE+path,{method:method,headers:h,body:body});
  if(res.status===401&&session&&!opts._r){opts._r=1;session.expires_at=1;await refreshIfNeeded();return api(method,path,opts);}
  var text=await res.text(),data=null;
  try{data=text?JSON.parse(text):null;}catch(e){data=text;}
  if(!res.ok){var er=new Error((data&&(data.message||data.error_description||data.error))||('HTTP '+res.status));er.status=res.status;er.code=data&&data.code;throw er;}
  return data;
}
function qs(q){return Object.keys(q).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(q[k])}).join('&');}
function sel(table,q,single){return api('GET','/rest/v1/'+table+'?'+qs(q),{headers:single?{'Accept':'application/vnd.pgrst.object+json'}:null});}
function ins(table,row){return api('POST','/rest/v1/'+table,{json:row,headers:{'Prefer':'return=minimal'}});}
function insRet(table,row){return api('POST','/rest/v1/'+table,{json:row,headers:{'Prefer':'return=representation','Accept':'application/vnd.pgrst.object+json'}});}
function upd(table,id,row){return api('PATCH','/rest/v1/'+table+'?id=eq.'+encodeURIComponent(id),{json:row,headers:{'Prefer':'return=minimal'}});}
function del(table,id){return api('DELETE','/rest/v1/'+table+'?id=eq.'+encodeURIComponent(id),{headers:{'Prefer':'return=minimal'}});}
function rpc(fn,args){return api('POST','/rest/v1/rpc/'+fn,{json:args||{}});}
async function uploadImage(blob){
  await refreshIfNeeded();
  var path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  var res=await fetch(BASE+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:authHeaders({'Content-Type':'image/jpeg','x-upsert':'false','cache-control':'max-age=3600'}),body:blob});
  if(!res.ok){var t=await res.text();var er=new Error(t||('HTTP '+res.status));er.status=res.status;throw er;}
  return path;
}
function removeImage(path){if(!path)return;api('DELETE','/storage/v1/object/'+BUCKET,{json:{prefixes:[path]}}).catch(function(){});}
function isDenied(e){return !!e&&(e.status===401||e.status===403||e.code==='42501'||/row-level security|not authorized|unauthorized|permission denied/i.test(e.message||''));}

/* ===== السلة وسجل الطلبات (محفوظة على هذا الجهاز) ===== */
var CKEY='captain_cart',OKEY='captain_orders';
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var cart=lsGet(CKEY,null);if(cart&&!Array.isArray(cart.items))cart=null;
var orders=lsGet(OKEY,[]);if(!Array.isArray(orders))orders=[];
function saveCart(){lsSet(CKEY,cart);updateBadge();}
function cartCount(){return cart?cart.items.reduce(function(a,i){return a+i.qty},0):0;}
function cartTotal(items){return items.reduce(function(a,i){return a+(i.price==null?0:i.price*i.qty)},0);}
function updateBadge(){var b=$('bdg');if(!b)return;var n=cartCount();b.hidden=!n;b.textContent=arNum(n);}
function orderMessage(){
  var L=['السلام عليكم، أود طلب ما يلي من القبطان:',''];
  cart.items.forEach(function(i){L.push('- '+i.name+' × '+arNum(i.qty)+(i.price==null?'':' = '+arPrice(i.price*i.qty)));});
  L.push('','الإجمالي: '+arPrice(cartTotal(cart.items)));
  var m=me();if(m.name)L.push('الاسم: '+m.name);if(m.phone)L.push('رقم الموبايل: '+arNum(m.phone));
  if(S.loc)L.push('موقعي: https://maps.google.com/?q='+S.loc.lat.toFixed(5)+','+S.loc.lng.toFixed(5));
  L.push('شكرًا لكم.');
  return L.join('\n');
}
async function finalizeOrder(ch){
  if(!cart||!cart.items.length)return;
  var c=cart,total=cartTotal(c.items),m=me(),saved=false;
  var km=(S.loc&&c.lat!=null)?haversine(S.loc.lat,S.loc.lng,c.lat,c.lng):0,eta=(c.prep||0)+Math.round(km*3)+5;
  if(session){
    var row={customer_name:m.name||null,customer_phone:m.phone||null,place_id:c.placeId,place_name:c.placeName,place_whatsapp:c.whatsapp||null,items:c.items,total:total,eta_minutes:eta};
    try{await ins('orders',Object.assign({},row,S.loc?{customer_lat:S.loc.lat,customer_lng:S.loc.lng}:{}));saved=true;}
    catch(e){try{await ins('orders',row);saved=true;}catch(e2){}}
  }
  if(!saved){
    orders.unshift({id:Date.now(),at:Date.now(),placeId:c.placeId,placeName:c.placeName,whatsapp:c.whatsapp||'',prep:c.prep,lat:c.lat,lng:c.lng,items:c.items,total:total});
    orders=orders.slice(0,30);lsSet(OKEY,orders);
  }
  cart=null;saveCart();
  var how=ch==='call'?'سجّلنا طلبك، وبعد مكالمتك للمحل يؤكد لك التفاصيل':'جهّزنا رسالة طلبك في واتساب';
  toast(saved?how+'، وأضفنا الطلب إلى طلباتك الجارية':how+'، وحفظنا الطلب في سجلك');
  if(route().name==='orders')render();
}

/* ===== الحالة ===== */
var S={rideStaff:false,perm:'asking',permCode:0,permState:'',loc:null,cats:[],places:[],catIdx:0,isAdmin:false,shops:[],flash:null,loaded:false,failed:false};
var renderTok=0;

async function checkAdmin(){
  if(!session){S.isAdmin=false;S.shops=[];S.rideStaff=false;return false;}
  try{S.isAdmin=(await rpc('is_admin'))===true;}catch(e){S.isAdmin=false;}
  try{var sh=await sel('shop_staff',{select:'place_id,places(name)',user_id:'eq.'+session.user.id});S.shops=(sh||[]).map(function(x){return{id:x.place_id,name:x.places?x.places.name:''};});}catch(e){S.shops=[];}
  try{var rs=await sel('ride_staff',{select:'user_id',user_id:'eq.'+session.user.id});S.rideStaff=!!(rs&&rs.length);}catch(e){S.rideStaff=false;}
  return S.isAdmin;
}
function placeById(id){for(var i=0;i<S.places.length;i++)if(S.places[i].id===id)return S.places[i];return null;}
function catById(id){for(var i=0;i<S.cats.length;i++)if(S.cats[i].id===id)return S.cats[i];return null;}

/* ===== الموقع ===== */
function askLocation(){
  S.perm='asking';S.loaded=false;
  if(!navigator.geolocation){S.perm='unsupported';render();return;}
  render();
  navigator.geolocation.getCurrentPosition(function(pos){
    S.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};S.perm='granted';loadHome();
  },function(err){
    S.perm='denied';S.permCode=err&&err.code||1;
    if(navigator.permissions&&navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(function(p){S.permState=p.state;render();},function(){render();});
    }else render();
  },{enableHighAccuracy:false,timeout:20000,maximumAge:300000});
}
async function loadHome(){
  S.failed=false;S.loaded=false;render();
  try{
    var r=await Promise.all([sel('categories',{select:'*',order:'sort_order.asc'}),rpc('places_near',{p_lat:S.loc.lat,p_lng:S.loc.lng})]);
    S.cats=r[0]||[];S.places=r[1]||[];S.loaded=true;
  }catch(e){S.failed=true;}
  render();

/* ===== البحث العربي ===== */
function norm(s){return String(s).toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();}
function words(s){return norm(s).split(/[\s،,]+/).filter(Boolean).map(function(w){return(w.indexOf('ال')===0&&w.length>2)?w.slice(2):w});}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function searchPlaces(q){
  var qt=words(q);if(!qt.length)return{exact:[],near:[]};
  var items=S.places.map(function(p){var c=catById(p.category_id);return{p:p,hay:words(p.name+' '+(c?c.label:'')+' '+(p.section_names||[]).join(' '))};});
  var exact=[],near=[];
  items.forEach(function(x){
    if(qt.every(function(t){return x.hay.some(function(w){return w.indexOf(t)!==-1})})){exact.push(x);return;}
    if(qt.every(function(t){var al=t.length>=6?2:t.length>=4?1:0;return x.hay.some(function(w){return w.indexOf(t)!==-1||lev(w,t)<=al})}))near.push(x);
  });
  function byDist(a,b){return a.p.distance_km-b.p.distance_km}
  exact.sort(byDist);exact=exact.slice(0,6);
  if(exact.length){var top=exact[0].p.category_id;items.forEach(function(x){if(x.p.category_id===top&&exact.indexOf(x)===-1&&near.indexOf(x)===-1)near.push(x);});}
  near=near.filter(function(x){return exact.indexOf(x)===-1}).sort(byDist).slice(0,4);
  return{exact:exact.map(function(x){return x.p}),near:near.map(function(x){return x.p})};
}

function dateAr(ms){try{return new Date(ms).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});}catch(e){return '';}}
var DAY=86400000,ordIdx={};
function isCurrent(o){var age=Date.now()-new Date(o.created_at).getTime();return !o.local&&(((o.status==='sent'||o.status==='received')&&age<DAY)||(o.status==='not_arrived'&&age<3*DAY));}
function localAsOrder(o){return{id:'L'+o.id,local:true,created_at:new Date(o.at).toISOString(),place_id:o.placeId||null,place_name:o.placeName,items:o.items,total:o.total,status:'local'};}
function ordStatusChip(o){
  if(o.local)return chip('chat','أُرسل عبر واتساب');
  if(o.status==='arrived')return chip('smile','وصل الطلب');
  if(isCurrent(o))return o.status==='not_arrived'?chip('clock','أبلغتنا أنه لم يصل، ونتابع مع المحل',true):o.status==='received'?chip('bag','المحل استلم طلبك',true):chip('chat','أُرسل الطلب');
  return chip('clock','لم يُؤكَّد');
}
function orderCard(o){

  else b='<div class="adm" style="padding-top:4px"><button class="btn s" data-act="reorder" data-id="'+esc(o.id)+'">'+icon('bag')+'أعد هذا الطلب</button></div>';
  return '<div class="card" style="flex-direction:column;gap:6px"><span class="nm" style="font-weight:700">'+esc(o.place_name)+'</span><span class="sc" style="font-size:12px;color:var(--fg-2)">'+esc(o.items.map(function(i){return i.name+' × '+arNum(i.qty)}).join('، '))+'</span><span class="chips">'+chip('clock',dateAr(o.created_at))+chip('tag',arPrice(o.total),true)+ordStatusChip(o)+'</span>'+b+'</div>';
}

var ASKKEY='captain_asked';
async function checkFollowUp(){
  if(!session||!session.user||$('scrim'))return;
  var rows;
  try{rows=await sel('orders',{select:'id,place_name,created_at,eta_minutes,status',user_id:'eq.'+session.user.id,status:'in.(sent,received)',order:'created_at.desc',limit:'5'});}catch(e){return;}
  var asked=lsGet(ASKKEY,{}),now=Date.now();
  var due=(rows||[]).filter(function(o){var age=now-new Date(o.created_at).getTime();return age>=((o.eta_minutes||45)+15)*60000&&age<DAY&&!(asked[o.id]&&now-asked[o.id]<30*60000);})[0];

async function ridesHtml(){

  function base(o){return chip('clock',dateAr(o.created_at))+chip('tag',arNum(o.passengers)+(o.passengers===1?' راكب':' ركاب'),true);}

  function card(o,isFresh){
    var open=!o.accepted_by,mine=!!o.accepted_by&&o.accepted_by===uid;
    /* طلب لم يقبله أحد: المنسّق يرى الوجهة وعدد الركاب فقط، وبيانات الراكب تظهر بعد القبول */
    if(open&&!S.isAdmin){
      if(!isFresh)return '<section class="acc"><h2>'+esc(o.destination)+'</h2><div class="chips">'+base(o)+chip('clock','انتهى دون قبول')+'</div></section>';
      return '<section class="acc"><h2>'+esc(o.destination)+'</h2><div class="chips">'+base(o)+'</div>'+acceptBtn(o,true)+'</section>';
    }
    /* طلب مع منسّق آخر */
    if(!open&&!mine&&!S.isAdmin)return '<section class="acc"><h2>'+esc(o.destination)+'</h2><div class="chips">'+base(o)+chip('user','الطلب مع '+(o.accepted_name||'منسّق آخر'),true)+'</div></section>';
    var wa=waPhone(o.customer_phone),map='https://maps.google.com/?q='+o.pickup_lat+','+o.pickup_lng;
    var msg='السلام عليكم يا '+(o.customer_name||'')+'، معك القبطان بخصوص مشوارك إلى '+o.destination+'.'+(o.driver_name?' سائقك: '+o.driver_name+(o.driver_car?'، والسيارة: '+o.driver_car:'')+'. نتفق على السعر قبل بدء المشوار.':' سنرسل لك اسم السائق ونوع السيارة ورقمها، ثم نتفق على السعر.');
    var who=open?chip('clock',(isFresh&&mins(o)>=5)?'معلّق منذ '+arNum(mins(o))+' دقيقة':'لم يقبله أحد بعد',true):chip('user',mine?'الطلب معك':'قبله: '+(o.accepted_name||'منسّق'),true);
    return '<section class="acc"><h2>'+esc(o.destination)+'</h2><div class="chips">'+chip('user',o.customer_name||'راكب')+(o.customer_phone?chip('phone',arNum(o.customer_phone)):'')+base(o)+who+(o.driver_name?chip('car','السائق: '+o.driver_name,true):'')+(o.driver_car?chip('car',o.driver_car):'')+'</div>'+
      (o.pickup_note?'<p>قرب مكانه: '+esc(o.pickup_note)+'</p>':'')+(o.note?'<p>'+esc(o.note)+'</p>':'')+
      '<div class="adm" style="padding-top:0">'+(open&&isFresh?acceptBtn(o,false):'')+(o.customer_phone?'<a class="btn '+(open&&isFresh?'s':'p')+'" href="tel:'+esc(telOf(o.customer_phone))+'">'+icon('phone')+'اتصل</a>':'')+(wa?'<a class="btn s" target="_blank" rel="noopener" href="https://wa.me/'+wa+'?text='+encodeURIComponent(msg)+'">'+icon('chat')+'واتساب</a>':'')+'<a class="btn s" target="_blank" rel="noopener" href="'+map+'">'+icon('pin')+'موقعه</a>'+
      '<button class="btn s" data-act="ridedriver" data-id="'+esc(o.id)+'">'+icon('user')+(o.driver_name?'تعديل السائق':'تحديد السائق')+'</button>'+
      '<button class="btn s" data-act="ridedone" data-id="'+esc(o.id)+'" data-v="'+(isFresh?'1':'0')+'">'+(isFresh?'تم التواصل':'إعادته للجديدة')+'</button></div></section>';
  }
  var h=hd+'<div class="g"><div class="sec-head"><h2>طلبات جديدة</h2></div>';
  if(!fresh.length)h+='<div class="empty" style="padding-top:0">لا توجد طلبات جديدة الآن.</div>';
  fresh.forEach(function(o){h+=card(o,true);});
  if(done.length){h+='<div class="sec-head"><h2>آخر الطلبات</h2></div>';done.forEach(function(o){h+=card(o,false);});}
  h+='<p style="padding:14px 0 0;font-size:12px;color:var(--fg-2)">تتحدث هذه الشاشة كل ١٠ ثوانٍ وهي مفتوحة. أول منسّق يضغط "اقبل الطلب" يأخذ الطلب، وعلامة "تم التواصل" تظهر لفريقكم فقط، ولا يراها الراكب.</p></div>';
  return{html:h,pending:fresh.filter(function(o){return !o.accepted_by;}).length};
}

/* رسالة التوفر: تصل لكل المنسّقين، وأول من يضغط "اقبل الطلب" يأخذه، والباقي يرى اسم من سبقهم */
function rideBeep(){
  try{var C=window.AudioContext||window.webkitAudioContext;if(C){var c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(function(){try{o.stop();c.close();}catch(e){}},350);}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
}

async function actRideAccept(id){
  try{
    var r=await rpc('ride_accept',{p_id:id});
    if(r==='ok')toast('الطلب لك الآن، تواصل مع الراكب');
    else if(typeof r==='string'&&r.indexOf('taken:')===0)toast('عذرًا، الطلب مع '+(r.slice(6)||'منسّق آخر'));
    else toast('هذا الطلب لم يعد موجودًا');
    closeRidePrompt();
    if(route().name==='rides')render();else if(r==='ok')location.hash='#/rides';
  }catch(e){toast(isDenied(e)?NOT_ALLOWED:'تعذّر قبول الطلب الآن، جرّب مرة أخرى');}
}
function showRidePrompt(o){

async function pollRidePrompt(){
  if(!session||!S.rideStaff||document.hidden||$('scrim'))return;
  try{
    var rows=await sel('rides',{select:'id,destination,passengers,created_at',accepted_by:'is.null',contacted:'eq.false',order:'created_at.asc',limit:'10'})||[];

/* ===== النماذج السفلية ===== */
function closeSheet(){var s=document.getElementById('scrim');if(s)s.remove();document.removeEventListener('keydown',escClose);}
function escClose(e){if(e.key==='Escape'){closeSheet();if(pending){pending(false);pending=null;}}}
var pending=null;
function openSheet(inner,mid,resolve){
  closeSheet();
  var w=document.createElement('div');w.id='scrim';w.className='scrim'+(mid?' mid':'');w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');
  w.innerHTML='<div class="sheet">'+(mid?'':'<div class="grab"></div>')+inner+'</div>';
  document.body.appendChild(w);
  pending=resolve||null;
  w.addEventListener('click',function(e){if(e.target===w){closeSheet();if(pending){pending(false);pending=null;}}});
  document.addEventListener('keydown',escClose);
  var f=w.querySelector('input:not([type=file]),select,textarea,button');if(f&&!mid)try{f.focus({preventScroll:true})}catch(e){}
  return w;
}
function fieldHtml(f){
  var id='f_'+f.id,h='<div class="field">';
  if(f.type==='select'){h+='<label for="'+id+'">'+esc(f.label)+'</label><select id="'+id+'">'+f.options.map(function(o){return '<option value="'+esc(o.value)+'"'+(String(o.value)===String(f.value)?' selected':'')+'>'+esc(o.label)+'</option>'}).join('')+'</select>';}
  else if(f.type==='textarea'){h+='<label for="'+id+'">'+esc(f.label)+'</label><textarea id="'+id+'" placeholder="'+esc(f.hint||'')+'">'+esc(f.value||'')+'</textarea>';}
  else{h+='<label for="'+id+'">'+esc(f.label)+'</label><input id="'+id+'" type="'+(f.type==='email'||f.type==='password'?f.type:'text')+'" '+(f.inputmode?'inputmode="'+f.inputmode+'" ':'')+(f.ltr?'class="ltr" dir="ltr" ':'')+(f.type==='email'?'autocomplete="username" ':f.type==='password'?'autocomplete="current-password" ':'')+'value="'+esc(f.value==null?'':f.value)+'" placeholder="'+esc(f.hint||'')+'">';}
  return h+'</div>';
}
function fileToJpeg(file,max){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',0.82);};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
/* نموذج عام: حقول، وصورة اختيارية بين الحقول، وزر حفظ */
function formSheet(o){
  return new Promise(function(resolve){
    var blob=null,inner='<h2>'+esc(o.title)+'</h2>'+(o.text?'<p>'+esc(o.text)+'</p>':'')+'<form id="sf" novalidate>';
    o.fields.forEach(function(f){
      if(f.type==='image'){
        inner+='<div class="field"><span class="lbl">'+esc(f.label)+'</span><div class="imgbox" id="imgBox">'+(f.url?'<img alt="" src="'+esc(f.url)+'">':'<div class="ph">'+icon('image')+'<span>لم تُضف صورة بعد</span></div>')+'</div>'+
          '<div class="row2"><button type="button" class="btn s" id="btnCam">'+icon('camera')+'التقاط صورة</button><button type="button" class="btn s" id="btnGal">'+icon('image')+'من المعرض</button></div>'+
          '<input type="file" id="fileCam" accept="image/*" capture="environment" hidden><input type="file" id="fileGal" accept="image/*" hidden></div>';
      }else inner+=fieldHtml(f);
    });
    inner+='<div class="acts"><button class="btn p block" type="submit" id="sfGo">'+esc(o.submit)+'</button><button class="btn s block" type="button" id="sfNo">إلغاء</button></div></form>';
    var w=openSheet(inner,false,resolve);
    function done(v){closeSheet();pending=null;resolve(v);}
    $('sfNo').addEventListener('click',function(){done(false);});
    if($('btnCam')){
      var pick=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;fileToJpeg(f,1600).then(function(b){blob=b;var box=$('imgBox');box.innerHTML='';var im=document.createElement('img');im.alt='';im.src=URL.createObjectURL(b);box.appendChild(im);}).catch(function(){toast('تعذّر قراءة الصورة، جرّب صورة أخرى');});};
      $('btnCam').addEventListener('click',function(){$('fileCam').click();});
      $('btnGal').addEventListener('click',function(){$('fileGal').click();});
      $('fileCam').addEventListener('change',pick);$('fileGal').addEventListener('change',pick);
    }
    $('sf').addEventListener('submit',async function(e){
      e.preventDefault();
      var vals={};o.fields.forEach(function(f){if(f.type!=='image')vals[f.id]=$('f_'+f.id).value;});
      var err=o.validate&&o.validate(vals);if(err){toast(err);return;}
      var b=$('sfGo');b.disabled=true;b.textContent='جاري الحفظ';
      try{await o.onSubmit(vals,blob);done(true);}
      catch(er){b.disabled=false;b.textContent=o.submit;toast(o.errText?o.errText(er):(isDenied(er)?NOT_ALLOWED:'تعذّر الحفظ الآن، جرّب مرة أخرى'));}
    });
  });
}

function productFields(p,cat){
  var f=[
    {id:'name',label:'اسم المنتج',type:'text',value:p.name||''},
    {type:'image',label:'صورة المنتج',url:imgUrl(p.image_path)},
    {id:'feat',label:'مميزات المنتج',type:'textarea',hint:'اكتب مميزات المنتج هنا',value:p.features||''},
    {id:'price',label:'سعر المنتج بالجنيه',type:'text',inputmode:'decimal',value:p.price==null?'':arNum(p.price)}
  ];
  if(cat){
    f.push({id:'item',label:'الصنف: به يظهر هذا المنتج في المحلات الأخرى عند الإعجاب',type:'select',value:p.item_id||'',options:[{value:'',label:'بدون ربط'}].concat(cat.items.map(function(i){return{value:i.id,label:(i.families?i.families.name+' › ':'')+i.name};}))});
    f.push({id:'newitem',label:'أو اكتب اسم صنف جديد',type:'text',hint:'مثل: جبنة رومي'});
    f.push({id:'fam',label:'فئة الصنف الجديد: منها تظهر البدائل عند عدم الإعجاب',type:'select',value:'',options:[{value:'',label:'اختر الفئة'}].concat(cat.families.map(function(x){return{value:x.id,label:x.name};}))});
    f.push({id:'newfam',label:'أو اكتب اسم فئة جديدة',type:'text',hint:'مثل: الجبن'});
  }
  return f;
}
function productValidate(v){
  if(!v.name.trim())return 'اكتب اسم المنتج أولًا';
  if(v.price.trim()&&num(v.price)===null)return 'اكتب السعر بالأرقام فقط';
  if((v.newitem||'').trim()&&!(v.fam||'')&&!(v.newfam||'').trim())return 'اختر فئة الصنف الجديد أو اكتب اسمها';
  return '';
}
/* يحدد الصنف المختار أو ينشئ الصنف والفئة الجديدين عند الحاجة، ويتجنب التكرار بمقارنة الأسماء بعد التطبيع */
async function resolveItem(v,cat){
  var nit=(v.newitem||'').trim();
  if(!nit)return v.item||null;
  var fid=v.fam||'',nf=(v.newfam||'').trim();
  if(nf){
    var fk=norm(nf),ef=cat.families.filter(function(f){return norm(f.name)===fk})[0];
    if(ef)fid=ef.id;else{var nfm=await insRet('families',{name:nf});fid=nfm.id;cat.families.push(nfm);}
  }
  var ik=norm(nit),ei=cat.items.filter(function(i){return i.family_id===fid&&norm(i.name)===ik})[0];
  if(ei)return ei.id;
  var ni=await insRet('items',{family_id:fid,name:nit});cat.items.push(ni);return ni.id;
}

async function addToCart(){
  var p=cur.product,pl=cur.place;if(!p||!pl)return;
  if(cart&&cart.items.length&&cart.placeId!==pl.id){
    if(!await confirmSheet('بدء طلب جديد','سلتك فيها منتجات من '+cart.placeName+'. الطلب الواحد يكون من محل واحد، فهل نبدأ طلبًا جديدًا؟','نعم، ابدأ طلبًا جديدًا',true))return;
    cart=null;
  }
  if(!cart)cart={placeId:pl.id,placeName:pl.name,whatsapp:pl.whatsapp||'',prep:pl.prep_minutes,lat:pl.lat,lng:pl.lng,items:[]};
  var it=null;cart.items.forEach(function(i){if(i.id===p.id)it=i;});
  if(it)it.qty+=1;else cart.items.push({id:p.id,name:p.name,price:p.price==null?null:Number(p.price),qty:1});
  saveCart();toast('أضفنا المنتج إلى طلبك');

function changeQty(id,d){
  if(!cart)return;
  cart.items.forEach(function(i){if(i.id===id)i.qty+=d;});
  cart.items=cart.items.filter(function(i){return i.qty>0});
  if(!cart.items.length)cart=null;
  saveCart();render();
}

  else if(a==='qty')changeQty(id,+el.getAttribute('data-d'));
  else if(a==='clearcart'){confirmSheet('تفريغ السلة','هل تريد حذف كل منتجات طلبك الحالي؟','نعم، فرّغ السلة').then(function(ok){if(ok){cart=null;saveCart();render();}});}
  else if(a==='clearorders'){confirmSheet('مسح السجل','هل تريد مسح سجل طلباتك السابقة من هذا الجهاز؟','نعم، امسح').then(function(ok){if(ok){orders=[];lsSet(OKEY,orders);render();}});}
  else if(a==='sendorder'){var ch=el.getAttribute('data-ch')||'whatsapp';setTimeout(function(){finalizeOrder(ch);},400);}
});
document.addEventListener('click',function(e){if(e.target.closest('#clr')){var q=$('q');q.value='';renderSugg();q.focus();}});

checkAdmin().then(function(ad){if($('addPlace'))$('addPlace').hidden=!ad;if(ad&&S.perm==='granted'&&route().name!=='home')render();});
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
updateBadge();
setTimeout(checkFollowUp,3000);setInterval(checkFollowUp,300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(checkFollowUp,800);});
if(session)checkAdmin().then(function(){if(S.rideStaff)pollRidePrompt();}).catch(function(){});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&session)refreshIfNeeded();});
window.addEventListener('storage',function(e){if(e.key===SKEY){session=readStored();if(!session){S.isAdmin=false;render();}}});
askLocation(); /* يُطلب إذن الموقع مباشرة عند فتح التطبيق */
})();
